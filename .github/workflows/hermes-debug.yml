name: Hermes Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERMES_HOME: /home/runner/.hermes
      AGENT_BRAIN_REPO: fundedakosh1-lang/agent-brain
      GH_PAT: ${{ secrets.GH_PAT }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      TMATE_WAIT_ITERATIONS: "3"
      TMATE_WAIT_TIMEOUT: "5"
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@v4

      - name: Setup Hermes
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: bash scripts/setup.sh

      - name: Publish tmate access
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: bash scripts/tmate-publish.sh

      - name: Start Hermes gateway
        run: |
          mkdir -p "$HERMES_HOME/logs"
          tmux new-session -d -s hermes "bash scripts/run.sh >> '$HERMES_HOME/logs/gateway.log' 2>&1"
          sleep 15
          if ! tmux has-session -t hermes 2>/dev/null; then
            echo "Hermes gateway failed to start" >&2
            exit 1
          fi
          echo "Hermes gateway started"

      - name: Stay alive briefly
        run: sleep 60