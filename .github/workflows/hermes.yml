name: Hermes 24/7

on:
  workflow_dispatch:
    inputs:
      relay:
        description: Internal relay run
        type: boolean
        default: false
      force:
        description: Start even if another run is active
        type: boolean
        default: false
      previous_run_id:
        description: Run id to wait for before starting the gateway
        type: string
        default: ""
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@v4
      - name: Check for an active Hermes run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELAY: ${{ github.event.inputs.relay }}
          FORCE: ${{ github.event.inputs.force }}
        run: bash scripts/guard.sh

  hermes:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 356
    env:
      HERMES_HOME: /home/runner/.hermes
      AGENT_BRAIN_REPO: fundedakosh1-lang/agent-brain
      RELAY_GRACE_SECONDS: "900"
      PREVIOUS_RUN_ID: ${{ github.event.inputs.previous_run_id }}
      GH_PAT: ${{ secrets.GH_PAT }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@v4

      - name: Set run deadline
        run: |
          now="$(date +%s)"
          echo "JOB_START=$now" >> "$GITHUB_ENV"
          echo "DEADLINE=$((now + 335 * 60))" >> "$GITHUB_ENV"

      - name: Setup Hermes
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: bash scripts/setup.sh

      - name: Publish web access
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: bash scripts/access-publish.sh

      - name: Start Hermes gateway
        run: |
          mkdir -p "$HERMES_HOME/logs"
          tmux new-session -d -s hermes "bash scripts/run.sh >> '$HERMES_HOME/logs/gateway.log' 2>&1"
          sleep 15
          if ! tmux has-session -t hermes 2>/dev/null; then
            echo "Hermes gateway failed to start" >&2
            exit 1
          fi
          touch "$RUNNER_TEMP/relay-enabled"
          echo "Hermes gateway started"

      - name: Start autosave loop
        run: |
          mkdir -p "$HERMES_HOME/logs"
          setsid bash scripts/autosave.sh >> "$HERMES_HOME/logs/autosave.log" 2>&1 < /dev/null &
          disown || true
          echo "Autosave loop started"

      - name: Keep runner alive
        run: |
          restarts=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if ! tmux has-session -t hermes 2>/dev/null; then
              restarts=$((restarts + 1))
              if [ "$restarts" -gt 10 ]; then
                echo "Hermes gateway died too many times" >&2
                exit 1
              fi
              echo "Hermes gateway is down; restart $restarts/10"
              sleep $((restarts * 15))
              tmux new-session -d -s hermes "bash scripts/run.sh >> '$HERMES_HOME/logs/gateway.log' 2>&1"
            fi
            sleep 60
          done
          echo "Run deadline reached; relaying"

      - name: Relay to next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: bash scripts/relay.sh
